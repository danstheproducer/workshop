document.getElementById('pw').onkeydown=e=>{if(e.key==='Enter')go();};
async function go(){
  const pw=document.getElementById('pw').value.trim();
  const err=document.getElementById('err');
  const btn=document.getElementById('btn');
  if(!pw){err.textContent='Ingresa la contraseña.';return;}
  btn.textContent='Abriendo…';btn.disabled=true;err.textContent='';
  await new Promise(r=>setTimeout(r,30));
  try{
    const raw=Uint8Array.from(atob(D),c=>c.charCodeAt(0));
    const salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},
      km,{name:'AES-GCM',length:256},false,['decrypt']
    );
    const dec=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
    const html=new TextDecoder().decode(dec);
    document.open();document.write(html);document.close();
  }catch(e){
    err.textContent='Contraseña incorrecta.';
    document.getElementById('pw').value='';
    document.getElementById('pw').focus();
    btn.textContent='Abrir';btn.disabled=false;
  }
}
</script>
